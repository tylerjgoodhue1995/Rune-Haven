[package]
name = "auth-server"
version = "0.1.0"
authors = ["Acrimon <joel.wejdenstal@gmail.com>"]
edition = "2018"

[dependencies]
uuid = { version = "1.4.1", default-features = false, features = ["serde", "v4"] }
auth-common = { path = "../common" }
rouille = "3.0.0"
serde_json = "1.0.60"
rust-argon2 = "2.0.0"
rusqlite = { version = "0.28", features = ["bundled"] }
rand = "0.8"
lazy_static = "1.4.0"
log = "0.4"
env_logger = "0.10"
chrono = { version = "0.4.31", default-features = false, features = ["std", "clock"] }
refinery = { version = "0.8.8", features = ["rusqlite"] }

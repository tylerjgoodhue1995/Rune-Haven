name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  VELOREN_GIT_VERSION: "/0/0"
  VELOREN_USERDATA_STRATEGY: "executable"

defaults:
  run:
    working-directory: veloren

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            ext: .exe
          - os: macos-latest
            name: macos-aarch64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-06-13

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: veloren
          key: ${{ matrix.os }}

      - name: Build server-cli
        run: cargo build --release -p veloren-server-cli

      - name: Build auth service
        run: cargo build --release --manifest-path auth-service/Cargo.toml --bin veloren-beta-auth

      - name: Build voxygen
        run: cargo build --release -p veloren-voxygen

      - name: Build Airshipper
        working-directory: airshipper
        run: cargo build --release -p airshipper --features runehaven

      - name: Stage release package
        shell: bash
        run: |
          set -eux
          stage="veloren-${{ matrix.name }}"
          mkdir -p "$stage/assets"
          cp -R assets/. "$stage/assets/"
          cp target/release/veloren-server-cli${{ matrix.ext }} "$stage/"
          cp target/release/veloren-beta-auth${{ matrix.ext }} "$stage/"
          cp target/release/veloren-voxygen${{ matrix.ext }} "$stage/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd "$stage" && 7z a "../$stage.zip" *)
          else
            (cd "$stage" && zip -r "../$stage.zip" *)
          fi
          launcher_stage="../airshipper-${{ matrix.name }}"
          mkdir -p "$launcher_stage"
          cp ../airshipper/target/release/airshipper${{ matrix.ext }} "$launcher_stage/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd "$launcher_stage" && 7z a "../airshipper-${{ matrix.name }}.zip" *)
          else
            (cd "$launcher_stage" && zip -r "../airshipper-${{ matrix.name }}.zip" *)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: veloren/veloren-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: airshipper-${{ matrix.name }}
          path: airshipper-${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create launcher metadata
        run: |
          printf '%s' "$GITHUB_REF_NAME" > version.txt
          printf '["weekly"]\n' > channels.json
          printf '{"version":1}\n' > api-version.json
          printf '{"message":null,"last_change":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > announcement.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            veloren/version.txt
            veloren/channels.json
            veloren/api-version.json
            veloren/announcement.json
          generate_release_notes: true
          overwrite_files: true

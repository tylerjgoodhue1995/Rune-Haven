[package]
name = "veloren-marketplace-service"
version = "0.18.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "tokio"] }
base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-client = "2.2"
solana-sdk = "2.2"
solana-transaction-status = "2.2"
spl-associated-token-account = "6.0"
spl-token = "7.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
